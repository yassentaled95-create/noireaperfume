<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noireá Perfume</title>
  <meta name="description" content="Noireá Perfume — اختار عطرك، واكتشف تجربتك.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .cart {
      border: 1px solid #444;
      padding: 10px 16px;
      border-radius: 30px;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }

    .hero-content {
      max-width: 700px;
    }

    .hero h1 {
      font-size: clamp(42px, 9vw, 90px);
      margin-bottom: 20px;
      letter-spacing: 4px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .btn {
      display: inline-block;
      background: #fff;
      color: #000;
      padding: 15px 30px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }

    .section {
      padding: 70px 7%;
    }

    .section h2 {
      font-size: 34px;
      margin-bottom: 35px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: #111;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 25px;
      min-height: 250px;
    }

    .product-image {
      height: 150px;
      background: #181818;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      margin-bottom: 20px;
    }

    .product h3 {
      margin-bottom: 10px;
    }

    .price {
      color: #bbb;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: #666;
      border-top: 1px solid #222;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Noireá</div>
    <div class="cart">🛒 السلة <span id="cartCount">0</span></div>
  </header>

  <main>

    <section class="hero">
      <div class="hero-content">
        <h1>Noireá</h1>

        <p>
          مش مجرد برفان.<br>
          اختار الريحة اللي تمثلك.
        </p>

        <a href="#products" class="btn">
          اكتشف العطور
        </a>
      </div>
    </section>

    <section class="section" id="products">
      <h2>اختار عطرك</h2>

      <div class="products">

        <div class="product">
          <div class="product-image">صورتك هنا</div>
          <h3>منتج تجريبي</h3>
          <p class="price">500 جنيه</p>
        </div>

        <div class="product">
          <div class="product-image">صورتك هنا</div>
          <h3>منتج تجريبي</h3>
          <p class="price">500 جنيه</p>
        </div>

        <div class="product">
          <div class="product-image">صورتك هنا</div>
          <h3>منتج تجريبي</h3>
          <p class="price">500 جنيه</p>
        </div>

      </div>
    </section>

  </main>

  <footer>
    © 2026 Noireá Perfume
  </footer>

</body>
</html>
