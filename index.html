<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noireá Perfume</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    header {
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .cart {
      border: 1px solid #444;
      padding: 10px 16px;
      border-radius: 30px;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 50px 20px;
    }

    .hero h1 {
      font-size: clamp(45px, 10vw, 90px);
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    .hero p {
      color: #aaa;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: white;
      color: black;
      padding: 15px 30px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }

    .products {
      padding: 60px 7%;
    }

    .products h2 {
      font-size: 34px;
      margin-bottom: 30px;
    }

    #product-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: #111;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 20px;
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 15px;
      background: #181818;
    }

    .product h3 {
      margin: 15px 0 8px;
    }

    .price {
      color: #aaa;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #666;
      border-top: 1px solid #222;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Noireá</div>

    <div class="cart">
      🛒 السلة
      <span id="cart-count">0</span>
    </div>
  </header>

  <section class="hero">
    <div>
      <h1>Noireá</h1>

      <p>
        مش مجرد برفان.<br>
        اختار الريحة اللي تمثلك.
      </p>

      <a href="#products" class="btn">
        اكتشف العطور
      </a>
    </div>
  </section>

  <section class="products" id="products">
    <h2>عطور Noireá</h2>

    <div id="product-list">
      <!-- المنتجات هتظهر هنا من Supabase -->
    </div>
  </section>

  <footer>
    © 2026 Noireá Perfume
  </footer>

</body>
</html>
